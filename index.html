<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b11">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; object-src 'none'; frame-src 'none'; media-src 'none'; base-uri 'none'; form-action 'none';">
<title>世界大戦までカウントダウン｜授業用完成版 Release 3.3</title>
<style>
:root{
  --bg:#070b11;--panel:#0d1520;--panel2:#121d2b;--gold:#cfa84e;--gold2:#f0d58b;
  --paper:#f3e6c9;--ink:#17130e;--muted:#aeb9c8;--red:#8d2330;--blue:#20558c;
  --green:#236344;--amber:#805523;--line:#584a2d;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:#f7f1df;font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",system-ui,sans-serif}
button{font:inherit}
button:focus-visible{outline:3px solid #fff2a8;outline-offset:2px}
#game{min-height:100vh;background:
  radial-gradient(circle at 50% -10%,#26354d 0,#0b1018 43%,#05080d 100%)}
.topbar{position:-webkit-sticky;position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:10px 14px;background:#060a10ee;border-bottom:1px solid #6d5b30;}
.brand{font-family:serif;font-weight:900;color:#f4df9c;line-height:1.25}
.mission{font-size:.82rem;color:#d9dfe8;text-align:center;flex:1}
.timer{font-size:1.18rem;font-weight:900;color:#ffe49b;white-space:nowrap}
.navBack{min-height:44px;padding:8px 11px;border:1px solid #7f6b3e;border-radius:8px;background:#101925;color:#f5df9a;cursor:pointer;white-space:nowrap}
.wrap{max-width:1180px;margin:auto;padding:16px}
.hero{min-height:720px;display:grid;place-items:center;padding:20px;background:
 linear-gradient(180deg,#05080c55,#05080cdd),
 radial-gradient(circle at 20% 20%,#76432b55,transparent 30%),
 linear-gradient(120deg,#15253b,#090d14 65%)}
.heroBox{width:min(900px,100%);text-align:center;padding:30px 22px;border:1px solid #8b7137;border-radius:18px;
 background:#070c14e8;box-shadow:0 24px 80px #0009}
.kicker{color:#d8c68c;letter-spacing:.16em;font-size:.82rem}
.hero h1{font-family:serif;font-size:clamp(2rem,6vw,4.8rem);line-height:1.08;margin:.28em 0;color:#fff0bc;text-shadow:0 4px 18px #000}
.hero h1 em{font-style:normal;color:#eb4b4e;white-space:nowrap;display:inline-block}
.subtitle{font-size:clamp(1rem,2.4vw,1.35rem);letter-spacing:.08em}
.btn{width:100%;min-height:52px;padding:12px 15px;margin:7px 0;border-radius:10px;border:1px solid #7f6b3e;
 color:#fff;background:linear-gradient(#2b3747,#121a25);cursor:pointer;text-align:left;transition:.12s}
.btn:hover{filter:brightness(1.12)}
.btn.primary{text-align:center;font-weight:800;background:linear-gradient(#a32938,#65131f);border-color:#d0a44f}
.btn.red{background:linear-gradient(#a12a37,#68151f)}
.btn.blue{background:linear-gradient(#2865a2,#173a65)}
.btn.green{background:linear-gradient(#2d7a52,#194b32)}
.btn.amber{background:linear-gradient(#9a692a,#5e401a)}
.btn.ghost{background:#0b1420}
.btn:disabled{opacity:.45;cursor:not-allowed}
.grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(290px,.8fr);gap:14px}
.scene{position:relative;min-height:680px;overflow:hidden;border:1px solid #806936;border-radius:14px;background:#121a24}
.sceneImg{position:absolute;inset:0;background-position:center center;background-repeat:no-repeat;background-size:cover;filter:saturate(.95) brightness(.82)}
.sceneShade{position:absolute;inset:0;background:linear-gradient(90deg,#0002,#0000 52%,#0007),linear-gradient(180deg,#0000 42%,#0009)}
.dialogue{position:absolute;left:3%;right:3%;bottom:3%;padding:20px;border-radius:12px;border:3px double #8b6b2d;
 background:linear-gradient(#fbf1db,#e8d6b0);color:var(--ink);box-shadow:0 14px 40px #000a}
.nameplate{display:inline-block;margin-top:-42px;margin-bottom:7px;padding:7px 14px;border:1px solid #c59c42;border-radius:8px;
 background:#08101b;color:#ffe6a2;font-weight:900}
.dialogue p{margin:.5em 0;line-height:1.82;font-size:1.03rem}
.side,.panel{border:1px solid #63532f;border-radius:14px;background:linear-gradient(#101a27,#09111b);padding:14px}
.side h3,.panel h2{margin:.3em 0 .7em;color:#f1d68e}
.card{padding:11px 12px;margin:8px 0;border:1px solid #443b2a;border-radius:10px;background:#0a131e}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.paper{padding:20px;border:8px double #6b5936;background:#ead8ae;color:#201a12;line-height:1.8}
.fact{padding:12px;margin:8px 0;border-left:4px solid #8d743b;background:#ffffff52}
.people{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.person{padding:0;border:1px solid #6a5835;border-radius:10px;overflow:hidden;background:#111b28;color:#fff;cursor:pointer;text-align:left}
.person img{display:block;width:100%;height:132px;object-fit:cover;object-position:center top}
.person span{display:block;padding:5px 8px}
.person .role{font-size:.78rem;color:#bfc8d5;padding-top:0}
.person.met{border-color:#d2ac50;box-shadow:inset 0 0 0 1px #d2ac50}
.meterRow{display:grid;grid-template-columns:110px 1fr;gap:9px;align-items:center;margin:8px 0}
.meter{height:9px;border-radius:999px;background:#26303a;overflow:hidden;border:1px solid #394450}
.meter i{display:block;height:100%;background:linear-gradient(90deg,#4f92da,#e5c65b)}
.tag{display:inline-block;margin:3px;padding:4px 8px;border:1px solid #766744;border-radius:999px;color:#ecd99e}
.event{padding:26px;border:1px solid #8a6e35;border-radius:14px;background:
 radial-gradient(circle at 80% 20%,#81421c44,transparent 25%),#111923}
.telegram{max-width:780px;margin:18px auto;padding:24px;border:8px double #705c36;background:#ead9b2;color:#251f16;line-height:1.8}
.log{max-height:310px;overflow:auto;padding-right:4px}
.logItem{padding:9px 10px;margin:6px 0;border-left:3px solid #8e783f;background:#0c1621}
.endingHero{padding:26px;text-align:center;border:1px solid #7c6635;border-radius:14px;background:#0d1723}
.endingHero h1{font-family:serif;color:#f0d68e}
.overlay{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:18px;background:#000d}
.modal{width:min(820px,100%);max-height:88vh;overflow:auto;padding:22px;border:1px solid #b29149;border-radius:14px;background:#0b1521}
.modal h2{color:#f0d68e;margin-top:0}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 220px}
.statusNote{padding:9px 11px;border-left:4px solid #b4934b;background:#121c29;color:#dbe2ec;margin:8px 0}
.missionBanner{padding:15px 16px;margin:10px 0 16px;border:2px solid #d2a94f;border-radius:12px;background:linear-gradient(135deg,#38131a,#111923);color:#fff3c4;box-shadow:inset 0 0 30px #0005}
.missionBanner span{display:block;font-size:.78rem;letter-spacing:.12em;color:#e9c66b;margin-bottom:5px}.missionBanner b{font-size:1.08rem;line-height:1.6}
.finalInput{width:100%;min-height:150px;resize:vertical;padding:14px;border:1px solid #8d7949;border-radius:10px;background:#f7ecd2;color:#17130e;font:inherit;font-size:1rem;line-height:1.7}
.finalInput:focus{outline:3px solid #f0d58b;outline-offset:2px}
.inputHint{font-size:.86rem;color:#c8d1dd;line-height:1.6;margin:8px 0}
.inputError{display:none;padding:10px 12px;border-left:4px solid #e05e61;background:#35141a;color:#ffe1df;margin:10px 0}
.setupGrid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.2fr);gap:16px;align-items:start}
.setupPreview{position:sticky;top:12px;text-align:center}
.playerPortrait{width:min(270px,80vw);aspect-ratio:4/5;margin:0 auto 12px;border:2px solid #8c7439;border-radius:16px;overflow:hidden;background:linear-gradient(#253245,#0c131d);box-shadow:0 14px 30px #0008}
.playerPortrait svg{width:100%;height:100%;display:block}
.choiceGroup{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:8px 0 15px}
.choiceCard{padding:11px 8px;border:1px solid #5d5238;border-radius:10px;background:#111b28;color:#eee3ca;cursor:pointer;text-align:center;line-height:1.45}
.choiceCard.selected{border-color:#f0d58b;box-shadow:0 0 0 2px #f0d58b33;background:#282116}
.lookGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:8px 0 15px}
.lookCard{padding:0;border:1px solid #5d5238;border-radius:12px;background:#101824;color:#eee3ca;overflow:hidden;cursor:pointer;text-align:center}
.lookCard.selected{border-color:#f0d58b;box-shadow:0 0 0 3px #f0d58b44}
.lookThumb{aspect-ratio:6/7;background:#111;overflow:hidden}
.lookThumb img{width:100%;height:100%;object-fit:cover;display:block}
.lookName{padding:7px 4px;font-size:.82rem;font-weight:800}
@media(max-width:560px){.lookGrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.profileChip{display:flex;align-items:center;gap:8px;padding:6px 9px;border:1px solid #6a5934;border-radius:999px;background:#101823;color:#f3e6c9;font-size:.78rem;white-space:nowrap}
.profileMini{width:28px;height:28px;border-radius:50%;overflow:hidden;border:1px solid #8c7439;background:#1b2635}
.profileMini svg{width:100%;height:100%;display:block}
.nameInput{width:100%;padding:12px 13px;border:1px solid #8d7949;border-radius:10px;background:#f7ecd2;color:#17130e;font:inherit;font-size:1rem}
.nameInput:focus{outline:3px solid #f0d58b;outline-offset:2px}
@media(max-width:760px){.setupGrid{grid-template-columns:1fr}.setupPreview{position:static}.choiceGroup{grid-template-columns:1fr}.profileChip{display:none}}
.feedbackHero{padding:20px;border:2px solid #c7a14d;border-radius:14px;background:linear-gradient(135deg,#36131a,#0e1722)}
.feedbackHero h2{margin:.2em 0 .5em;color:#ffe39a;font-family:serif;font-size:clamp(1.35rem,3vw,2rem);line-height:1.45}
.playerQuote{padding:14px 16px;margin:12px 0;border-left:5px solid #cfa84e;background:#101a27;color:#f8efd7;line-height:1.8}
.climax{padding:34px 22px;text-align:center;border:1px solid #8b7137;border-radius:16px;background:radial-gradient(circle at 50% 10%,#51252b55,transparent 38%),linear-gradient(#111923,#05080d)}
.climax .clockLine{font-family:serif;font-size:clamp(1.2rem,3vw,1.8rem);line-height:1.8;color:#f7e9bf;margin:12px auto;max-width:760px}
.rage{padding:28px 22px;border:2px solid #a7393f;border-radius:16px;background:radial-gradient(circle at 50% 10%,#8c1e2855,transparent 36%),linear-gradient(#2b0c11,#09090c)}
.rage h1{font-family:serif;color:#ffcb9a;font-size:clamp(1.8rem,5vw,3.4rem)}
.impactGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.impactCard{padding:12px;border:1px solid #51452e;border-radius:10px;background:#0d1723;line-height:1.65}
.impactCard b{color:#f0d58b}
.exchangePlayer{padding:11px 13px;margin:8px 0 12px;border-radius:10px;background:#101b2b;color:#f5e6bd;border-left:5px solid #4f92da;line-height:1.7}
.exchangeNpc{padding:11px 13px;margin:8px 0;border-radius:10px;background:#efe1bf;color:#20180e;border-left:5px solid #b68a31;line-height:1.75}
.exchangeLabel{font-size:.78rem;letter-spacing:.08em;font-weight:900;opacity:.78;margin-bottom:4px}
@media(max-width:620px){.impactGrid{grid-template-columns:1fr}}
.hr{height:1px;background:#5a4c2d;margin:16px 0}
.endGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hidden{display:none!important}
@media(max-width:860px){
 .grid{grid-template-columns:1fr}.side{order:2}.scene{min-height:620px}.people{grid-template-columns:repeat(4,1fr)}
 .person img{height:90px}.mission{display:none}.topbar{padding:9px 10px}.brand{font-size:.88rem}
}
@media(max-width:620px){
 .wrap{padding:10px}.hero{min-height:650px}.heroBox{padding:22px 14px}.scene{min-height:560px}
 .people{grid-template-columns:1fr 1fr}.person img{height:100px}.dialogue{padding:14px;left:2%;right:2%}
 .dialogue p{font-size:.98rem}.meterRow{grid-template-columns:95px 1fr}.endGrid{grid-template-columns:1fr}
 .timer{font-size:1rem}.brand{font-size:.8rem}
}

/* ===== Tablet / iPad / Chromebook stability patch ===== */
html{
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
  overflow-x:hidden;
}
body{
  width:100%;
  max-width:100%;
  min-height:100vh;
  min-height:100dvh;
  overflow-x:hidden;
  overscroll-behavior-y:contain;
}
#game{
  min-height:100vh;
  min-height:100dvh;
}
button,.btn,.navBack,.choiceCard,.lookCard,.person{
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
input,textarea,button{
  font-size:16px;
}
input,textarea{
  max-width:100%;
}
.topbar{
  padding-left:max(14px,env(safe-area-inset-left));
  padding-right:max(14px,env(safe-area-inset-right));
}
.wrap{
  padding-left:max(16px,env(safe-area-inset-left));
  padding-right:max(16px,env(safe-area-inset-right));
}
.dialogue{
  overflow-wrap:anywhere;
  word-break:normal;
}
.exchangePlayer,.exchangeNpc,.playerQuote,.card,.fact,.impactCard{
  overflow-wrap:anywhere;
}
@media(max-width:860px){
  .topbar{
    flex-wrap:wrap;
    align-items:center;
    gap:6px 10px;
  }
  .brand{flex:1 1 auto;min-width:0}
  .timer{margin-left:auto}
  .profileChip{display:none}
  .scene{min-height:640px}
  .dialogue{
    max-height:58%;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
  }
  .side{min-width:0}
}
@media(max-width:620px){
  .wrap{
    padding-left:max(10px,env(safe-area-inset-left));
    padding-right:max(10px,env(safe-area-inset-right));
    padding-bottom:max(14px,env(safe-area-inset-bottom));
  }
  .topbar{
    padding-left:max(10px,env(safe-area-inset-left));
    padding-right:max(10px,env(safe-area-inset-right));
  }
  .scene{min-height:590px}
  .dialogue{max-height:62%}
  .hero{min-height:100dvh}
  .hero h1 em{white-space:normal}
  .btn,.navBack,.choiceCard{min-height:48px}
}
@media(orientation:landscape) and (max-height:700px){
  .scene{min-height:520px}
  .dialogue{max-height:66%}
  .hero{min-height:620px}
}


/* ===== Release 3.2: iPad / Chromebook compatibility ===== */
html,body{
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
  -webkit-overflow-scrolling:touch;
}
button,.btn,.navBack,.choiceCard,.lookCard,.person{
  -webkit-appearance:none;
  appearance:none;
  touch-action:manipulation;
  -webkit-tap-highlight-color:rgba(0,0,0,0);
}
input,textarea,select,button{font-size:16px}
img{max-width:100%}
@media(max-width:860px){
  .topbar{position:-webkit-sticky;position:sticky}
  .scene{min-height:620px}
}
@media(max-width:620px){
  .scene{min-height:560px}
}

</style>
